<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropostaPro | Sistema de Propostas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="view-admin" class="hidden">
        <nav class="p-6 flex justify-between items-center bg-white shadow-sm border-b border-slate-100">
            <h1 class="text-2xl font-extrabold text-blue-600 tracking-tight">Proposta<span class="text-slate-800">Pro</span></h1>
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Admin Mode</span>
        </nav>

        <main class="max-w-3xl mx-auto mt-12 p-4">
            <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 p-8 space-y-6">
                <h3 class="text-2xl font-bold border-b pb-4">Gerar Nova Proposta</h3>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Nome do Cliente</label>
                    <input id="nomeCliente" type="text" placeholder="Ex: Maria Joana" class="w-full p-4 border-2 border-slate-100 rounded-xl outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Serviço</label>
                        <input id="servico" type="text" placeholder="Ex: Web Design" class="w-full p-4 border-2 border-slate-100 rounded-xl outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Valor (€)</label>
                        <input id="valor" type="number" placeholder="Ex: 1500" class="w-full p-4 border-2 border-slate-100 rounded-xl outline-none focus:border-blue-500">
                    </div>
                </div>
                <button id="btnGerar" onclick="salvarNoBanco()" class="w-full bg-blue-600 text-white py-5 rounded-2xl text-xl font-extrabold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">GERAR LINK DA PROPOSTA 🔗</button>
                
                <div id="resultado" class="hidden mt-6 p-6 bg-green-50 rounded-2xl border-2 border-dashed border-green-200 text-center animate-pulse">
                    <p class="text-green-800 font-bold mb-4">✅ Link Gerado com Sucesso!</p>
                    <p id="linkFinal" class="text-slate-600 text-xs mb-4 break-all bg-white p-2 border rounded font-mono"></p>
                    <button onclick="copiar()" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-800 transition">Copiar Link</button>
                </div>
            </div>
        </main>
    </div>

    <div id="view-client" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-100">
        <div class="max-w-xl w-full bg-white rounded-[40px] shadow-2xl p-10 border border-white">
            <div class="flex justify-between items-start mb-10">
                <div class="bg-blue-600 text-white p-3 rounded-2xl font-black italic">PP</div>
                <div class="text-right">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Orçamento Ref.</p>
                    <p id="prop-id" class="text-sm font-mono text-slate-600 font-bold"></p>
                </div>
            </div>
            
            <h2 class="text-3xl font-black text-slate-900 mb-2">Olá, <span id="prop-cliente" class="text-blue-600">...</span></h2>
            <p class="text-slate-500 font-medium mb-10">Abaixo seguem os detalhes da proposta solicitada.</p>
            
            <div class="bg-slate-50 rounded-3xl p-8 mb-8 border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase mb-2 text-[10px] tracking-widest">Serviço Descriminado</p>
                <p id="prop-servico" class="text-xl font-bold text-slate-800 mb-6"></p>
                
                <p class="text-xs font-bold text-slate-400 uppercase mb-2 text-[10px] tracking-widest">Investimento Total</p>
                <p id="prop-valor" class="text-4xl font-black text-blue-600 tracking-tighter"></p>
            </div>

            <button onclick="aceitarProposta()" class="w-full bg-green-500 text-white py-6 rounded-3xl text-xl font-black hover:bg-green-600 shadow-xl shadow-green-100 transition-all transform hover:scale-[1.02]">ACEITAR PROPOSTA AGORA ✅</button>
            <p class="text-center mt-6 text-[10px] text-slate-400 font-bold uppercase tracking-widest">Proposta gerada via PropostaPro</p>
        </div>
    </div>

    <script>
        // --- SUAS CHAVES CONFIGURADAS ---
        const SUPABASE_URL = 'https://tfzpfryytdguwiyoeout.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_plAvEwolNmyg_8fznVJelg_8rpadXAF';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- ROTEAMENTO AUTOMÁTICO ---
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const propId = urlParams.get('id');

            if (propId) {
                document.getElementById('view-client').classList.remove('hidden');
                carregarProposta(propId);
            } else {
                document.getElementById('view-admin').classList.remove('hidden');
            }
        };

        // --- FUNÇÃO PARA SALVAR NO BANCO ---
        async function salvarNoBanco() {
            const nome = document.getElementById('nomeCliente').value;
            const servico = document.getElementById('servico').value;
            const valor = document.getElementById('valor').value;
            const btn = document.getElementById('btnGerar');

            if(!nome || !servico || !valor) {
                alert("Preencha todos os campos para continuar.");
                return;
            }

            btn.innerText = "Processando...";
            btn.disabled = true;

            const linkId = Math.random().toString(36).substring(2, 9);

            const { error } = await supabaseClient.from('propostas').insert([
                { cliente: nome, servico: servico, valor: valor, link_id: linkId }
            ]);

            if (error) {
                alert("Erro ao salvar: " + error.message);
                btn.innerText = "Tentar Novamente";
                btn.disabled = false;
            } else {
                document.getElementById('resultado').classList.remove('hidden');
                const linkFinal = window.location.origin + window.location.pathname + "?id=" + linkId;
                document.getElementById('linkFinal').innerText = linkFinal;
                btn.innerText = "GERAR LINK DA PROPOSTA 🔗";
                btn.disabled = false;
            }
        }

        // --- FUNÇÃO PARA CARREGAR DADOS DO CLIENTE ---
        async function carregarProposta(id) {
            const { data, error } = await supabaseClient
                .from('propostas')
                .select('*')
                .eq('link_id', id)
                .single();

            if (data) {
                document.getElementById('prop-cliente').innerText = data.cliente;
                document.getElementById('prop-servico').innerText = data.servico;
                document.getElementById('prop-valor').innerText = "€ " + data.valor;
                document.getElementById('prop-id').innerText = "#" + data.link_id;
            } else {
                document.body.innerHTML = "<div class='flex h-screen items-center justify-center font-bold text-slate-500'>Proposta não encontrada ou expirada.</div>";
            }
        }

        function copiar() {
            const link = document.getElementById('linkFinal').innerText;
            navigator.clipboard.writeText(link);
            alert("Link copiado! Envie agora para o seu cliente.");
        }

        function aceitarProposta() {
            alert("Sucesso! O prestador foi notificado do seu aceite.");
        }
    </script>
</body>
</html>
